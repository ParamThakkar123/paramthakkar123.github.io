theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-scholar

titles_from_headings:
  strip_title: true
  collections: true

collections:
  notes:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      tags: Other
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: note

# jekyll-scholar configuration (used by GitHub Actions build)
scholar:
  bibliography: _bibliography.bib
  style: apa
  details: true
