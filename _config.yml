#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

minima:
  date_format: "%b %-d, %Y"

# jekyll-feed generates /feed.xml
feed:
  path: feed.xml

# Jekyll skips dotfiles and _-prefixed files by default; force these into the
# build output so the agent-discovery catalog and headers file are published.
include:
  - .well-known
  - _headers

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-scholar

titles_from_headings:
  strip_title: true
  collections: true

collections:
  notes:
    output: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      tags: Other
      layout: post
  - scope:
      path: ""
      type: notes
    values:
      layout: note

# jekyll-scholar configuration (used by GitHub Actions build)
scholar:
  bibliography: _bibliography.bib
  style: apa
  details: true
