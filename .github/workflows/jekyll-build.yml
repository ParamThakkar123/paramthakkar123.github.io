name: Build site with jekyll-scholar

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # public_suffix in the lockfile requires Ruby >= 3.2 — upgrade runner Ruby
          ruby-version: '3.2'
          bundler: '4.0.9'

      - name: Install dependencies
        run: |
          # setup-ruby already installs the requested Bundler version; avoid
          # installing a different Bundler that could cause a restart/mismatch
          gem install jekyll jekyll-scholar
          bundle install

      - name: Build site
        run: |
          bundle exec jekyll build --verbose

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
