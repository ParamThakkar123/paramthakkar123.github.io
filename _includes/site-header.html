{% assign current_url = page.url | default: "/" %}
<header class="site-header">
  <div class="shell header-shell">
    <a class="brand" rel="author" href="{{ "/" | relative_url }}">
      <span class="brand-name">{{ site.author }}</span>
    </a>

    <nav class="site-nav">
      <!-- Theme toggle inserted into header -->
      <button class="theme-toggle" id="theme-toggle" aria-pressed="false" title="Toggle dark mode">
        <span class="toggle-track" aria-hidden="true">
          <span class="toggle-thumb">
            <!-- Sun icon -->
            <svg class="icon-sun" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" focusable="false">
              <circle cx="12" cy="12" r="4" fill="currentColor"></circle>
              <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="12" y1="1.5" x2="12" y2="4.5"></line>
                <line x1="12" y1="19.5" x2="12" y2="22.5"></line>
                <line x1="1.5" y1="12" x2="4.5" y2="12"></line>
                <line x1="19.5" y1="12" x2="22.5" y2="12"></line>
                <line x1="4.2" y1="4.2" x2="6.1" y2="6.1"></line>
                <line x1="17.9" y1="17.9" x2="19.8" y2="19.8"></line>
                <line x1="4.2" y1="19.8" x2="6.1" y2="17.9"></line>
                <line x1="17.9" y1="6.1" x2="19.8" y2="4.2"></line>
              </g>
            </svg>

            <!-- Moon icon -->
            <svg class="icon-moon" viewBox="0 0 24 24" width="12" height="12" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </span>
        </span>
        <span class="sr-only">Toggle dark mode</span>
      </button>
      <input type="checkbox" id="nav-trigger" class="nav-trigger">
      <label for="nav-trigger" class="nav-toggle">
        <span></span><span></span><span></span>
      </label>

      <ul class="nav-list">
        <li><a class="nav-link{% if current_url == '/publications.html' %} active{% endif %}" href="{{ '/publications.html' | relative_url }}">Publications</a></li>
        <li><a class="nav-link{% if current_url == '/projects.html' or current_url contains '/projects/' %} active{% endif %}" href="{{ '/projects.html' | relative_url }}">Projects</a></li>
        <li><a class="nav-link{% if current_url == '/work-experience.html' %} active{% endif %}" href="{{ '/work-experience.html' | relative_url }}">Work</a></li>
        <li><a class="nav-link{% if current_url == '/achievements.html' %} active{% endif %}" href="{{ '/achievements.html' | relative_url }}">Achievements</a></li>
        <li><a class="nav-link{% if current_url == '/journey.html' %} active{% endif %}" href="{{ '/journey.html' | relative_url }}">Journey</a></li>
        <li><a class="nav-link{% if current_url == '/archive.html' or page.layout == 'post' %} active{% endif %}" href="{{ '/archive.html' | relative_url }}">Blogs</a></li>
        <li><a class="nav-link{% if current_url == '/learnings.html' %} active{% endif %}" href="{{ '/learnings.html' | relative_url }}">Learnings</a></li>
        <li><a class="nav-link{% if current_url == '/notes.html' or page.layout == 'note' %} active{% endif %}" href="{{ '/notes.html' | relative_url }}">Notes</a></li>
        <li><a class="nav-link cv-link" href="{{ '/Param_Thakkar_Res.pdf' | relative_url }}">CV</a></li>
      </ul>
    </nav>
  </div>
</header>
