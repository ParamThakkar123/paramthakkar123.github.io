---
layout: default
---
<article class="content-surface document-page">
  <header class="page-head">
    {% if page.kicker %}
      <p class="eyebrow">{{ page.kicker }}</p>
    {% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="page-intro">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="prose-flow">
    {{ content }}
  </div>
</article>
